<section class="projects" id="projects">
  <div class="section-head reveal">
    <p class="eyebrow">{{projects.eyebrow}}</p>
    <h2>{{projects.h2}}</h2>
    <p class="section-head__lead">{{projects.lead}}</p>
  </div>

  <div class="projects__layout">
    <article class="project project--wide reveal">
      <figure class="project__media">
        <img src="{{photos.1.src}}" alt="Фасад проекта" width="1600" height="900" loading="lazy" />
      </figure>
      <div class="project__meta">
        <h3>{{projects.items.0.title}}</h3>
        <p>{{projects.items.0.text}}</p>
      </div>
    </article>

    <article class="project reveal">
      <figure class="project__media">
        <img src="{{photos.2.src}}" alt="Интерьер" width="1200" height="900" loading="lazy" />
      </figure>
      <div class="project__meta">
        <h3>{{projects.items.1.title}}</h3>
        <p>{{projects.items.1.text}}</p>
      </div>
    </article>

    <article class="project reveal">
      <figure class="project__media">
        <img src="{{photos.3.src}}" alt="Фасад проекта" width="1200" height="675" loading="lazy" />
      </figure>
      <div class="project__meta">
        <h3>{{projects.items.2.title}}</h3>
        <p>{{projects.items.2.text}}</p>
      </div>
    </article>
  </div>
</section>
