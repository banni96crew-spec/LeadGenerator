<section class="section section--tight" id="proof">
  <div class="section__inner proof">
    <div class="reveal">
      <p class="section__label">Доказательства</p>
      <h2 class="section__title">Работу можно проверить</h2>
      <ul class="proof-list">
        {{#social_proof.cases}}
        <li>{{.}}</li>
        {{/social_proof.cases}}
        {{#social_proof.reviews}}
        <li>{{.}}</li>
        {{/social_proof.reviews}}
      </ul>
    </div>
    {{#photos.0}}
    <div class="photo-strip reveal reveal--delay-2" aria-hidden="true">
      {{#photos}}
      <img src="{{src}}" alt="" loading="lazy" />
      {{/photos}}
    </div>
    {{/photos.0}}
  </div>
</section>
