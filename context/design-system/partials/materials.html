<section class="materials" id="materials">
  <div class="materials__grid">
    <figure class="materials__media reveal">
      <img src="{{photos.4.src}}" alt="Материалы" width="1536" height="1024" loading="lazy" decoding="async" />
    </figure>
    <div class="materials__copy reveal">
      <p class="eyebrow">{{materials.eyebrow}}</p>
      <h2>{{materials.h2}}</h2>
      <p class="prose">{{materials.prose}}</p>
      <ul class="checklist">
        <li>{{materials.items.0}}</li>
        <li>{{materials.items.1}}</li>
        <li>{{materials.items.2}}</li>
      </ul>
    </div>
  </div>
</section>
