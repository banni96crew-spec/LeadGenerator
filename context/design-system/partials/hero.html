<section class="hero" id="top" aria-label="Главный экран">
  <div class="hero__media">
    <img
      src="{{photos.0.src}}"
      alt="Фасад проекта"
      width="1536"
      height="1024"
      fetchpriority="high"
      decoding="async"
    />
  </div>
  <div class="hero__veil" aria-hidden="true"></div>
  <div class="hero__content">
    <p class="hero__brand">{{brand.name}}</p>
    <h1 class="hero__title">{{hero.headline}}</h1>
    <p class="hero__lead">{{hero.subheadline}}</p>
    <div class="hero__actions">
      <a class="btn btn--primary" href="#contact">{{hero.cta_primary}}</a>
      <a class="btn btn--ghost" href="#projects">{{hero.cta_secondary}}</a>
    </div>
  </div>
</section>
