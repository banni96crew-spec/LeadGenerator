<a class="skip-link" href="#main-content">К основному содержимому</a>
<section class="hero" id="main-content">
  <nav class="hero__nav" aria-label="Навигация">
    <a class="hero__nav-link" href="#contact">{{contact.cta}}</a>
  </nav>
  {{#photos.0}}
  <div class="hero__media" aria-hidden="true">
    <img src="{{photos.0}}" alt="" />
  </div>
  {{/photos.0}}
  <div class="hero__scrim" aria-hidden="true"></div>
  <div class="hero__content">
    <div class="hero__brand reveal">
      {{#brand.logo}}
      <img src="{{brand.logo}}" alt="{{brand.name}}" />
      {{/brand.logo}}
      {{^brand.logo}}
      <span class="hero__brand-name">{{brand.name}}</span>
      {{/brand.logo}}
    </div>
    <h1 class="hero__title reveal reveal--delay-1">{{hero.headline}}</h1>
    <p class="hero__sub reveal reveal--delay-2">{{hero.subheadline}}</p>
    <a class="btn btn--primary reveal reveal--delay-3" href="#contact">{{hero.cta}}</a>
  </div>
</section>
