<section class="section" id="benefits">
  <div class="section__inner">
    <p class="section__label reveal">Преимущества</p>
    <h2 class="section__title reveal reveal--delay-1">Почему выбирают нас</h2>
    <div class="benefits-grid">
      {{#benefits}}
      <article class="benefit reveal reveal--delay-2">
        <h3 class="benefit__title">{{title}}</h3>
        <p class="benefit__text">{{text}}</p>
      </article>
      {{/benefits}}
    </div>
  </div>
</section>
