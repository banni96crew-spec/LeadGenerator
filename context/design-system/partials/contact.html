<section class="section contact" id="contact">
  <div class="section__inner reveal">
    <p class="section__label">Контакты</p>
    <h2 class="section__title">Обсудим вашу задачу</h2>
    <div class="contact__row reveal reveal--delay-2">
      <a class="contact__phone" href="tel:{{contact.phone_digits}}">{{contact.phone}}</a>
      <a class="btn btn--primary" href="tel:{{contact.phone_digits}}">{{contact.cta}}</a>
    </div>
  </div>
</section>

<a class="mobile-action" href="tel:{{contact.phone_digits}}" aria-label="{{contact.cta}}: {{contact.phone}}">
  <span>{{contact.cta}}</span>
  <span class="mobile-action__icon" aria-hidden="true">↗</span>
</a>
